name: Compression des images

# Se déclenche quand une photo est ajoutée/modifiée dans public/img (ex. via le back-office).
on:
  push:
    branches: [main]
    paths:
      - 'public/img/**'

permissions:
  contents: write

# Une seule exécution à la fois.
concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer sharp
        run: npm install sharp --no-save --no-audit --no-fund

      - name: Compresser les images lourdes
        run: node scripts/optimize-images.mjs

      - name: Publier les images compressées
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Compression images"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Compression automatique des images"
            git push
          else
            echo "Aucune image à compresser."
          fi
